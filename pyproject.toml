[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intelbit-floweon-connector-sap"
description = "Коннектор SAP ECC (OData V2) для Интелбит.Фловеон"
version = "0.2.1"
authors = [{ name = "Святослав Михайлов", email = "vceo@intelbit.ru" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "intelbit-floweon-sdk",
]

# Резолв коннектора ядром по `type` из connectors/*.yaml пресета (floweon run, 4-17-24).
[project.entry-points."floweon.connectors"]
"intelbit.connector.sap" = "intelbit_floweon_connector_sap.connector:SapConnector"

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "respx",
    "fastapi",
    "httpx[asgi]",
    "python-multipart",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/SvyatoslavMikhailov/intelbit-floweon-connector-sap"
Repository = "https://github.com/SvyatoslavMikhailov/intelbit-floweon-connector-sap"

[tool.uv.sources]
intelbit-floweon-sdk = { git = "https://github.com/SvyatoslavMikhailov/intelbit-floweon-sdk", tag = "v0.3.0" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001/002/003 — кириллические «двойники»; проект ведёт комментарии по-русски.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "contract: contract-тесты против FastAPI-мока SAP Gateway (ASGITransport)",
]
